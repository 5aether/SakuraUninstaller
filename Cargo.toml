[package]
name = "SakuraUninstaller"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[lib]
name = "sakura_uninstaller"

[[test]]
name = "windows_smoke"
path = "tests/integration/windows_smoke.rs"

[dependencies]
# Lean Windows configuration: winit windowing + software renderer, no OpenGL/Qt.
slint = { version = "1.19", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "accessibility",
    "compat-1-2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
sha2 = "0.10"
ed25519-dalek = "2.2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
windows-api = { package = "windows", version = "0.62", features = [
    "ApplicationModel",
    "Management_Deployment",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }
windows-registry = "0.100"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.19"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
